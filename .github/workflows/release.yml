name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Published release commit is not on main" >&2
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version and registry state
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          package_version=$(node -p 'require("./package.json").version')
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/@argus%2fmonitor/$package_version")
          if [[ "$status" == "200" ]]; then
            echo "Version $package_version is already published"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Registry lookup returned HTTP $status. Refusing to publish." >&2
            exit 1
          fi

      - name: Test distribution and publish to npm
        if: steps.version.outputs.already_published != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:distribution
          npm publish --ignore-scripts
